<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Giovanni Developer Arena</title>
  <desc id="desc">Banner animado de perfil para Giovanni, estudante da ETEC no programa AMS e desenvolvedor em formação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091B3A"/>
      <stop offset="0.52" stop-color="#102C5B"/>
      <stop offset="1" stop-color="#26134F"/>
    </linearGradient>
    <linearGradient id="panel" x1="80" y1="60" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163B77" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#101A42" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE36E"/>
      <stop offset="0.45" stop-color="#FFB52E"/>
      <stop offset="1" stop-color="#F47C20"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="360" y1="130" x2="800" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5A6"/>
      <stop offset="0.35" stop-color="#FFCA43"/>
      <stop offset="0.72" stop-color="#FF8B3D"/>
      <stop offset="1" stop-color="#FF5D83"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65F4FF"/>
      <stop offset="1" stop-color="#4D9DFF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="54" y="42" width="1092" height="356" rx="30"/></clipPath>
    <style>
      .label { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 3px; }
      .body { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 600; letter-spacing: 1px; }
      .title { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 8px; }
      @keyframes drift { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      @keyframes driftSlow { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(10px,-8px); } }
      @keyframes pulse { 0%,100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes scan { 0% { transform: translateX(-210px); opacity: 0; } 15% { opacity: .55; } 55% { opacity: .2; } 100% { transform: translateX(1180px); opacity: 0; } }
      @keyframes shine { 0%,35% { transform: translateX(-230px); opacity: 0; } 45% { opacity: .9; } 70%,100% { transform: translateX(520px); opacity: 0; } }
      .float { animation: drift 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .floatSlow { animation: driftSlow 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scan { animation: scan 7s linear infinite; }
      .shine { animation: shine 5.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="32" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#6BC9FF" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
    <path d="M80 0V440M200 0V440M320 0V440M440 0V440M560 0V440M680 0V440M800 0V440M920 0V440M1040 0V440M1160 0V440"/>
  </g>
  <circle cx="1010" cy="90" r="155" fill="#5342C4" opacity="0.22"/>
  <circle cx="188" cy="364" r="170" fill="#00B8C8" opacity="0.13"/>

  <rect x="54" y="42" width="1092" height="356" rx="30" fill="url(#panel)" stroke="#4B82CB" stroke-opacity="0.78" stroke-width="2"/>
  <rect x="70" y="58" width="1060" height="324" rx="22" stroke="#8EDBFF" stroke-opacity="0.12"/>

  <g clip-path="url(#panelClip)">
    <rect class="scan" x="0" y="58" width="190" height="324" fill="url(#cyan)" opacity="0.15" transform="skewX(-18)"/>
    <path d="M96 328H1105" stroke="#6EEBFF" stroke-opacity="0.3" stroke-dasharray="3 12"/>
    <path d="M96 102H300" stroke="#6EEBFF" stroke-opacity="0.3" stroke-dasharray="3 12"/>
  </g>

  <g class="floatSlow" opacity="0.88">
    <circle cx="105" cy="112" r="17" fill="url(#gold)" stroke="#FFECA3" stroke-width="3"/>
    <path d="M105 101L108.5 108L116 109L110.5 114.5L112 122L105 118.5L98 122L99.5 114.5L94 109L101.5 108L105 101Z" fill="#FFF4A4"/>
  </g>
  <g class="float" opacity="0.92">
    <circle cx="1048" cy="294" r="18" fill="url(#gold)" stroke="#FFECA3" stroke-width="3"/>
    <path d="M1048 283L1051.5 290L1059 291L1053.5 296.5L1055 304L1048 300.5L1041 304L1042.5 296.5L1037 291L1044.5 290L1048 283Z" fill="#FFF4A4"/>
  </g>
  <g class="pulse" filter="url(#smallGlow)">
    <circle cx="111" cy="266" r="4" fill="#75F6FF"/>
    <circle cx="1090" cy="124" r="4" fill="#FFCF4C"/>
  </g>

  <g transform="translate(105 145)">
    <rect x="0" y="0" width="180" height="146" rx="22" fill="#0B1D3D" stroke="#4E9DDA" stroke-width="2"/>
    <rect x="14" y="14" width="152" height="70" rx="15" fill="#132F5F"/>
    <circle cx="90" cy="49" r="23" fill="#FFB43D"/>
    <path d="M67 42C70 22 110 20 114 43C108 35 100 32 90 34C81 32 75 36 67 42Z" fill="#2B174C"/>
    <circle cx="82" cy="51" r="3.5" fill="#172444"/><circle cx="98" cy="51" r="3.5" fill="#172444"/>
    <path d="M82 64C87 68 94 68 99 64" stroke="#172444" stroke-width="3" stroke-linecap="round"/>
    <text font-family="DejaVu Sans" x="90" y="108" text-anchor="middle" class="label" font-size="12" fill="#86EFFF">PLAYER CARD</text>
    <text font-family="DejaVu Sans" x="90" y="128" text-anchor="middle" class="body" font-size="12" fill="#FFFFFF">GIOVANNI</text>
  </g>

  <text font-family="DejaVu Sans" x="600" y="96" text-anchor="middle" class="label" font-size="14" fill="#7CEFFF">DEVELOPER ARENA / PLAYER 001</text>
  <text font-family="DejaVu Sans" x="600" y="186" text-anchor="middle" class="title" font-size="66" fill="url(#titleGradient)">GIOVANNI</text>
  <rect class="shine" x="390" y="122" width="32" height="88" fill="#FFFFFF" opacity="0" transform="skewX(-18)"/>
  <text font-family="DejaVu Sans" x="600" y="222" text-anchor="middle" class="body" font-size="18" fill="#F5F8FF">STUDENT  /  DEVELOPER IN TRAINING  /  GAME DEV</text>

  <g transform="translate(396 258)">
    <rect width="408" height="54" rx="27" fill="#081A36" stroke="#4C83C9" stroke-width="2"/>
    <circle cx="28" cy="27" r="8" fill="#65F4A5" filter="url(#smallGlow)"/>
    <text font-family="DejaVu Sans" x="52" y="33" class="label" font-size="13" fill="#FFFFFF">STATUS: LEARNING MODE</text>
  </g>

  <g transform="translate(865 122)">
    <path d="M34 10V31M18 15H50V35C50 52 18 52 18 35V15Z" fill="url(#gold)" stroke="#FFEFA6" stroke-width="3"/>
    <path d="M18 20H7C7 42 18 43 22 38M50 20H61C61 42 50 43 46 38" stroke="#FFCF4C" stroke-width="6" stroke-linecap="round"/>
    <rect x="27" y="50" width="14" height="10" rx="2" fill="#FFB52E"/>
    <rect x="15" y="60" width="38" height="8" rx="4" fill="#FFE36E"/>
    <text font-family="DejaVu Sans" x="34" y="94" text-anchor="middle" class="label" font-size="10" fill="#FFF1A0">QUEST XP</text>
  </g>

  <text font-family="DejaVu Sans" x="600" y="358" text-anchor="middle" class="body" font-size="13" fill="#A9C7F1">ETEC / AMS  /  HTML + CSS + JAVA + JAVASCRIPT  /  NEXT QUEST: GAME DEVELOPMENT</text>
  <text font-family="DejaVu Sans" x="600" y="383" text-anchor="middle" class="label" font-size="10" fill="#5BE9FF">BUILDING THE SKILL TREE, ONE LEVEL AT A TIME</text>
</svg>
