<svg width="1000" height="560" viewBox="0 0 1000 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Giovanni Developer Arena</title>
  <desc id="desc">Player card animado de Giovanni, estudante da ETEC no programa AMS e desenvolvedor em formação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#081935"/><stop offset="0.5" stop-color="#102F61"/><stop offset="1" stop-color="#291347"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#204982"/><stop offset="1" stop-color="#131B45"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF19A"/><stop offset="0.45" stop-color="#FFBF35"/><stop offset="1" stop-color="#F27432"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFDE61"/><stop offset="0.55" stop-color="#FF8E45"/><stop offset="1" stop-color="#FF5F83"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#69F3FF"/><stop offset="1" stop-color="#4F96FF"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frameClip"><rect x="35" y="35" width="930" height="490" rx="34"/></clipPath>
    <style>
      .label { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 3px; }
      .body { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 1px; }
      .title { font-family: "DejaVu Sans", Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 8px; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      
      @keyframes shine { 0%, 30% { transform: translateX(-220px) skewX(-18deg); opacity: 0; } 42% { opacity: .8; } 65%,100% { transform: translateX(520px) skewX(-18deg); opacity: 0; } }
      @keyframes xpFill { from { width: 0; } to { width: 235px; } }
      @keyframes trophyPulse { 0%,100% { opacity: .9; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translate(0,0); opacity: .6; } 50% { transform: translate(12px,-12px); opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .playerCard { animation: fadeIn .8s .2s cubic-bezier(.2,.8,.2,1) both; }
      .heroTitle { animation: fadeIn .75s .42s cubic-bezier(.2,.8,.2,1) both; }
      .shine { animation: shine 5.8s 1.1s ease-in-out infinite; }
      .xpBar { animation: xpFill 1.5s .9s cubic-bezier(.2,.8,.2,1) both; }
      .trophy { animation: trophyPulse 3.8s 1.3s ease-in-out infinite; }
      .drift { animation: drift 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>


  <rect width="1000" height="560" rx="38" fill="url(#bg)"/>
  <g opacity=".16" stroke="#6FD8FF" stroke-width="1"><path d="M0 110H1000M0 220H1000M0 330H1000M0 440H1000"/><path d="M100 0V560M250 0V560M400 0V560M550 0V560M700 0V560M850 0V560"/></g>
  <circle cx="830" cy="100" r="210" fill="#6D42C7" opacity=".2"/>
  <circle cx="130" cy="500" r="210" fill="#00B7C9" opacity=".12"/>
  <rect x="35" y="35" width="930" height="490" rx="34" fill="#0D2148" fill-opacity=".72" stroke="#548ED0" stroke-width="2"/>
  <rect x="52" y="52" width="896" height="456" rx="24" stroke="#85DFFF" stroke-opacity=".18"/>


  <g clip-path="url(#frameClip)">
    <path d="M54 404H946" stroke="#75DFFF" stroke-opacity=".2" stroke-dasharray="4 15"/>
    <path d="M54 128H284" stroke="#75DFFF" stroke-opacity=".2" stroke-dasharray="4 15"/>
    <rect class="shine" x="300" y="80" width="36" height="350" fill="#FFF" opacity="0"/>
  </g>


  <g class="drift"><circle cx="91" cy="100" r="17" fill="url(#gold)" stroke="#FFF1A5" stroke-width="3"/><path d="M91 89L95 97L103 98L97 104L98 112L91 108L84 112L85 104L79 98L87 97L91 89Z" fill="#FFF8B8"/></g>
  <g class="drift" style="animation-delay:1.6s"><circle cx="910" cy="444" r="17" fill="url(#gold)" stroke="#FFF1A5" stroke-width="3"/><path d="M910 433L914 441L922 442L916 448L917 456L910 452L903 456L904 448L898 442L906 441L910 433Z" fill="#FFF8B8"/></g>
  <circle class="pulse" cx="902" cy="100" r="5" fill="#6EF4FF" filter="url(#smallGlow)"/>
  <circle class="pulse" cx="107" cy="430" r="5" fill="#FFCA45" filter="url(#smallGlow)"/>


  <g class="playerCard" transform="translate(85 150)">
    <rect width="240" height="295" rx="26" fill="url(#card)" stroke="#68CFFF" stroke-width="2"/>
    <rect x="18" y="18" width="204" height="142" rx="19" fill="#0B1A39" stroke="#396CA9"/>
    <circle cx="120" cy="78" r="46" fill="#FFB643"/>
    <path d="M74 66C80 28 157 27 166 69C151 52 135 47 120 50C104 47 88 53 74 66Z" fill="#2C164C"/>
    <circle cx="104" cy="80" r="5" fill="#172442"/><circle cx="136" cy="80" r="5" fill="#172442"/>
    <path d="M104 103C114 111 126 111 136 103" stroke="#172442" stroke-width="4" stroke-linecap="round"/>
    <text font-family="DejaVu Sans" x="120" y="199" text-anchor="middle" class="label" font-size="20" fill="#FFFFFF">GIOVANNI</text>
    <text font-family="DejaVu Sans" x="120" y="231" text-anchor="middle" class="body" font-size="21" fill="#FFCF4C">LV. 01</text>
    <text font-family="DejaVu Sans" x="120" y="266" text-anchor="middle" class="body" font-size="18" fill="#78EEFF">ETEC / AMS</text>
  </g>


  <g class="heroTitle" transform="translate(340 125)">
    <text font-family="DejaVu Sans" x="295" y="0" text-anchor="middle" class="label" font-size="18" fill="#75F1FF">PLAYER 001</text>
    <text font-family="DejaVu Sans" x="295" y="105" text-anchor="middle" class="title" font-size="72" fill="url(#coral)">GIOVANNI</text>
    <text font-family="DejaVu Sans" x="295" y="153" text-anchor="middle" class="body" font-size="25" fill="#F7FAFF">STUDENT / DEVELOPER</text>
    <rect x="45" y="190" width="500" height="76" rx="38" fill="#081832" stroke="#FFB543" stroke-width="2"/>
    <circle cx="79" cy="228" r="10" fill="#65F4A5" filter="url(#smallGlow)"/>
